<body><main><a href="index.html">返回比價首頁</a><h1>屈臣氏完整商品價格</h1>
<p>2026/09/23 核對「隱形眼鏡－線上訂、門市取」分類全部 4 頁，共 206 個品項。</p>
<p>價格以新臺幣列示。「買2件，每件折後價」須符合多件購買條件，並非單買一件的價格；不同優惠條件請分別比較。</p>
<p>保留目錄顯示的規格與度數，未展開各度數選項。「未標示缺貨」不代表所有規格均有貨，實際價格及優惠依商品頁與結帳為準。</p>
